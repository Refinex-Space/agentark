name: Knowledge Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  knowledge-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate repository knowledge
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 tools/harness/knowledge_gate.py --base "origin/$BASE_REF"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python3 tools/harness/knowledge_gate.py --base "$BEFORE_SHA"
          else
            python3 tools/harness/knowledge_gate.py
          fi
