      # 参数位置。
      in: path
      # 路径参数不可省略。
      required: true
      # UUIDv7 参数结构。
      schema: { $ref: "#/components/schemas/UuidV7" }
    # 项目标识路径参数。
    ProjectId:
      # 参数名称。
      name: projectId
      # 参数位置。
      in: path
      # 路径参数不可省略。
      required: true
      # UUIDv7 参数结构。
      schema: { $ref: "#/components/schemas/UuidV7" }
    # 环境标识路径参数。
    EnvironmentId:
      # 参数名称。
      name: environmentId
      # 参数位置。
      in: path
      # 路径参数不可省略。
      required: true
      # UUIDv7 参数结构。
      schema: { $ref: "#/components/schemas/UuidV7" }
    # 资产分类路径参数。
    AssetKind:
      # 参数名称。
      name: assetKind
      # 参数位置。
      in: path
      # 路径参数不可省略。
      required: true
      # 只允许固定公开分类。
      schema: { $ref: ../schemas/catalog-public/v1.json#/$defs/AssetKind }
    # 稳定资产标识路径参数。
    AssetId:
      # 参数名称。
      name: assetId
      # 参数位置。
      in: path
      # 路径参数不可省略。
      required: true
      # UUIDv7 参数结构。
      schema: { $ref: "#/components/schemas/UuidV7" }
    # 不透明游标查询参数。
    Cursor:
      # 参数名称。
      name: cursor
      # 参数位置。
      in: query
      # 首次查询可省略。
      required: false
      # URL 安全短字符串。
      schema: { type: string, minLength: 1, maxLength: 256 }
    # 游标页大小查询参数。
    Limit:
      # 参数名称。
      name: limit
      # 参数位置。
      in: query
      # 使用服务端默认值时可省略。
      required: false
      # 页大小边界与实现一致。
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    # API Key 标识路径参数。
    ApiKeyId:
      # 参数名称。
      name: apiKeyId
      # 参数位置。
      in: path
      # 路径参数不可省略。
      required: true
      # UUIDv7 参数结构。
      schema: { $ref: "#/components/schemas/UuidV7" }
  # 注册公共 HTTP 响应模板。
  responses:
    # 定义采用 application/problem+json 的错误响应。
    ProblemResponse:
      # 说明该响应承载 AgentArk Problem Detail。
      description: AgentArk problem detail
      # 列出该错误响应支持的媒体类型。
      content:
        # 固定 RFC 9457 风格错误的媒体类型。
        application/problem+json:
          # 描述该媒体类型的响应体 Schema。
          schema:
            # 复用版本化的公共错误 JSON Schema。
            $ref: ../schemas/problem-detail/v1.json
    # 项目列表响应。
    ProjectList:
