          content:
            # 固定 JSON 媒体类型。
            application/json:
              # 版本页契约。
              schema: { $ref: "#/components/schemas/CursorPageCatalogVersion" }
        # 未认证。
        "401": { $ref: "#/components/responses/ProblemResponse" }
        # 越权。
        "403": { $ref: "#/components/responses/ProblemResponse" }
        # 不存在。
        "404": { $ref: "#/components/responses/ProblemResponse" }
    # 只追加新版本。
    post:
      # 稳定操作标识。
      operationId: createCatalogVersion
      # Catalog 功能分组。
      tags: [Catalog]
      # 版本请求。
      requestBody:
        # 请求不可省略。
        required: true
        # 请求媒体类型。
        content:
          # 固定 JSON 请求。
