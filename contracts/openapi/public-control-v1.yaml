        "401": { $ref: "#/components/responses/ProblemResponse" }
        # 越权。
        "403": { $ref: "#/components/responses/ProblemResponse" }
        # 引用或 Owner 不存在。
        "404": { $ref: "#/components/responses/ProblemResponse" }
        # 唯一版本或 Hash 冲突。
        "409": { $ref: "#/components/responses/ProblemResponse" }
  # 不回显值的版本 Diff 端点。
  /api/v1/projects/{projectId}/catalog/{assetKind}/{assetId}/versions:diff:
    # 复用路径参数。
    parameters:
      # 项目标识。
      - { $ref: "#/components/parameters/ProjectId" }
      # 资产分类。
      - { $ref: "#/components/parameters/AssetKind" }
      # 稳定资产标识。
      - { $ref: "#/components/parameters/AssetId" }
    # 比较两个不可变版本。
    get:
