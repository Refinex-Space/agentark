{{- if .Values.ingress.enabled }}
# 公共 API 只进入 Gateway，Web 使用独立静态 Service。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agentark.fullname" . }}
  labels:
    {{- include "agentark.labels" (dict "root" . "component" "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.apiHost | quote }}
        - {{ .Values.ingress.webHost | quote }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.apiHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "agentark.fullname" . }}-gateway
                port:
                  name: http
    - host: {{ .Values.ingress.webHost | quote }}
      http:
        paths:
          # 浏览器业务 API 与静态站点保持同源。
          - path: /api
            # API 子路径全部进入 Gateway。
            pathType: Prefix
            # 选择 Gateway Service。
            backend:
              # Kubernetes Service 引用。
              service:
                # 固定当前 Release Gateway。
                name: {{ include "agentark.fullname" . }}-gateway
                # 使用 Gateway HTTP 端口。
                port:
                  # 引用命名端口。
                  name: http
          # OIDC 登录起点保持 Web 同源。
          - path: /oauth2
            # 所有 Client Registration 路径进入 Gateway。
            pathType: Prefix
            # 选择 Gateway Service。
            backend:
              # Kubernetes Service 引用。
              service:
                # 固定当前 Release Gateway。
                name: {{ include "agentark.fullname" . }}-gateway
                # 使用 Gateway HTTP 端口。
                port:
                  # 引用命名端口。
                  name: http
          # OIDC Authorization Code Callback 保持 Web 同源。
          - path: /login/oauth2
            # 所有受控 Callback 路径进入 Gateway。
            pathType: Prefix
            # 选择 Gateway Service。
            backend:
              # Kubernetes Service 引用。
              service:
                # 固定当前 Release Gateway。
                name: {{ include "agentark.fullname" . }}-gateway
                # 使用 Gateway HTTP 端口。
                port:
                  # 引用命名端口。
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "agentark.fullname" . }}-web
                port:
                  name: http
{{- end }}
