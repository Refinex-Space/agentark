# 本地 Profile 激活条件，本文件只包含非敏感的服务地址模板。
spring:
  # 限制该配置文档只在 local Profile 生效。
  config:
    # 声明 Profile 激活表达式。
    activate:
      # 仅当 `local` 被激活时加载。
      on-profile: local

# Scheduler 本地 Profile 仍只通过版本化 URL 与 Control/Runtime 协作。
agentark:
  # Foundation 本地身份验证配置。
  foundation:
    # Scheduler 管理 API 继续独立校验 JWT。
    security:
      # 只有显式身份 Overlay 才开启。
      enabled: ${AGENTARK_LOCAL_SECURITY_ENABLED:false}
      # Token 中受信 Issuer。
      issuer-uri: ${AGENTARK_LOCAL_OIDC_ISSUER_URI:}
      # Compose 内部 JWK Set 地址。
      jwk-set-uri: ${AGENTARK_LOCAL_OIDC_JWK_SET_URI:}
      # 只允许受控本地 HTTP 身份端点。
      insecure-http-enabled: ${AGENTARK_LOCAL_SECURITY_INSECURE_HTTP_ENABLED:false}
      # Scheduler 专属 Audience。
      audiences:
        - agentark-scheduler
  # Scheduler 本地运行配置。
  scheduler:
    # Control Plane 基础地址；Compose 使用服务 DNS 覆盖。
    control-base-url: ${AGENTARK_CONTROL_BASE_URL:http://localhost:8081}
    # Runtime Plane 基础地址；Compose 使用服务 DNS 覆盖。
    runtime-base-url: ${AGENTARK_RUNTIME_BASE_URL:http://localhost:8082}
    # 本地默认仍不开启 Worker，必须显式配置服务身份后再启用。
    worker-enabled: ${AGENTARK_SCHEDULER_WORKER_ENABLED:false}
