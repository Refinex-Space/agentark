name: Dependency and License

on:
  pull_request:
    paths:
      - "**/pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/dependency-license.yml"
  push:
    branches:
      - main
    paths:
      - "**/pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/dependency-license.yml"

permissions:
  contents: read

concurrency:
  group: dependency-license-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-license:
    name: Dependency convergence, licenses, and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Generate dependency evidence
        run: ./mvnw -B -ntp -DskipTests verify
      - name: Upload dependency evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-license-evidence
          path: |
            target/bom.json
            target/generated-resources/licenses/THIRD-PARTY.txt
          if-no-files-found: error
          retention-days: 14
