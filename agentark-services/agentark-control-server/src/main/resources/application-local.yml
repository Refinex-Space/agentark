# 本地 Profile 激活条件，本文件只包含非敏感的服务地址模板。
spring:
  # 限制该配置文档只在 local Profile 生效。
  config:
    # 声明 Profile 激活表达式。
    activate:
      # 仅当 `local` 被激活时加载。
      on-profile: local

# Control 只通过 URL 访问其他平面，不共享 Server 实现。
agentark:
  # 声明 Control 可见的内部服务端点。
  services:
    # Runtime Plane 基础地址；Compose 使用服务 DNS 覆盖。
    runtime-base-url: ${AGENTARK_RUNTIME_BASE_URL:http://localhost:8082}
    # Scheduler Plane 基础地址；Compose 使用服务 DNS 覆盖。
    scheduler-base-url: ${AGENTARK_SCHEDULER_BASE_URL:http://localhost:8083}
