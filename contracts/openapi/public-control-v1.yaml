        "401": { $ref: "#/components/responses/ProblemResponse" }
        # 越权。
        "403": { $ref: "#/components/responses/ProblemResponse" }
        # 乐观锁冲突。
        "409": { $ref: "#/components/responses/ProblemResponse" }
  # Skill Artifact 受控上传端点。
  /api/v1/projects/{projectId}/skill-artifacts:
    # 复用项目参数。
    parameters:
      # 项目标识。
      - { $ref: "#/components/parameters/ProjectId" }
    # 上传但不执行 Skill Artifact。
    post:
      # 稳定操作标识。
      operationId: uploadSkillArtifact
      # Catalog 功能分组。
      tags: [Catalog]
      # Multipart 请求。
      requestBody:
        # 请求不可省略。
        required: true
        # 请求媒体类型。
        content:
          # 固定 Multipart 类型。
          multipart/form-data:
            # 文件与可选校验和。
            schema:
              # Multipart 对象。
              type: object
              # 文件不可省略。
              required: [file]
              # Multipart 属性。
              properties:
                # 二进制 Artifact。
                file: { type: string, format: binary }
                # 可选预期 SHA-256。
                checksum: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
      # 上传结果。
      responses:
        # 上传成功。
        "201":
          # 成功说明。
          description: Artifact 已写入 Object Store
          # JSON 响应。
          content:
            # 固定 JSON 媒体类型。
            application/json:
              # ObjectRef 契约。
              schema: { $ref: "#/components/schemas/ObjectRef" }
        # 未认证。
        "401": { $ref: "#/components/responses/ProblemResponse" }
        # 越权。
        "403": { $ref: "#/components/responses/ProblemResponse" }
        # Object Store 冲突。
        "409": { $ref: "#/components/responses/ProblemResponse" }
