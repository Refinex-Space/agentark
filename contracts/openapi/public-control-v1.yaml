          content:
            # 固定 JSON 媒体类型。
            application/json:
              # Revision 页契约。
              schema: { $ref: "#/components/schemas/CursorPageKnowledgeRevision" }
        # 未认证。
        "401": { $ref: "#/components/responses/ProblemResponse" }
        # 越权。
        "403": { $ref: "#/components/responses/ProblemResponse" }
        # Knowledge Base 不存在。
        "404": { $ref: "#/components/responses/ProblemResponse" }
    # 创建绑定文档修订和已发布 Profile 的新 Revision。
    post:
      # 稳定操作标识。
      operationId: createKnowledgeRevision
      # Knowledge 功能分组。
      tags: [Knowledge]
      # 创建请求体。
      requestBody:
        # 请求不可省略。
        required: true
        # 请求媒体类型。
        content:
          # 固定 JSON 请求。
          application/json:
            # Revision 创建契约。
            schema: { $ref: "#/components/schemas/CreateKnowledgeRevisionRequest" }
      # 创建结果。
      responses:
        # 创建成功。
        "201":
          # 成功说明。
          description: CREATED Knowledge Revision 已创建
          # JSON 响应。
          content:
            # 固定 JSON 媒体类型。
            application/json:
              # Revision 契约。
              schema: { $ref: "#/components/schemas/KnowledgeRevision" }
        # 未认证。
        "401": { $ref: "#/components/responses/ProblemResponse" }
        # 越权。
        "403": { $ref: "#/components/responses/ProblemResponse" }
        # 引用资源不存在。
        "404": { $ref: "#/components/responses/ProblemResponse" }
        # Profile 未发布或版本冲突。
        "409": { $ref: "#/components/responses/ProblemResponse" }
  # Knowledge Revision 摄取意图端点。
