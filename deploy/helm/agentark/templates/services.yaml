{{- range $component := list "gateway" "control" "runtime" "scheduler" "web" }}
{{- $service := index $.Values.services $component }}
# {{ $component }} 集群内稳定 Service DNS；不引入额外服务发现组件。
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentark.componentName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "agentark.labels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "agentark.selectorLabels" (dict "root" $ "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ $service.port }}
      targetPort: http
      protocol: TCP
  {{- if or (eq $component "runtime") (eq $component "gateway") }}
  sessionAffinity: None
  {{- end }}
---
{{- end }}

