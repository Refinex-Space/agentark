    # Public Snapshot Inspector 响应。
    AgentSnapshot:
      # 固定对象结构。
      type: object
      # Revision、摘要和 Snapshot 不可省略。
      required: [revisionId, contentHash, snapshot]
      # 定义 Snapshot Envelope。
      properties:
        # 返回当前 Snapshot 所属的不可变 Revision UUIDv7。
        revisionId: { $ref: "#/components/schemas/UuidV7" }
        # 返回 Canonical Snapshot 的 SHA-256 完整性摘要。
        contentHash: { $ref: "#/components/schemas/Checksum" }
        # 不含明文 Secret 的完整 Snapshot；具体递归结构由独立 Snapshot v1 Schema 校验。
        snapshot: { type: object, additionalProperties: true }
      # 禁止未声明字段。
      additionalProperties: false
    # Revision 安全差异摘要。
    AgentRevisionComparison:
      # 固定对象结构。
      type: object
      # 两端标识、摘要和变化区段不可省略。
      required: [baseRevisionId, targetRevisionId, baseContentHash, targetContentHash, changedSections]
      # 定义比较字段。
      properties:
        # 基准 Revision UUIDv7。
        baseRevisionId: { $ref: "#/components/schemas/UuidV7" }
        # 目标 Revision UUIDv7。
        targetRevisionId: { $ref: "#/components/schemas/UuidV7" }
        # 基准 Snapshot SHA-256。
        baseContentHash: { $ref: "#/components/schemas/Checksum" }
        # 目标 Snapshot SHA-256。
        targetContentHash: { $ref: "#/components/schemas/Checksum" }
        # 发生变化的非秘密顶层区段。
        changedSections: { type: array, uniqueItems: true, items: { type: string, pattern: "^[a-z][a-zA-Z0-9]*$" } }
      # 禁止未声明字段。
      additionalProperties: false
