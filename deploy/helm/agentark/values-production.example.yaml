# 开启生产渲染门禁；本示例只使用非敏感占位，不可直接部署。
global:
  # Helm 模板将拒绝 Tag、单副本、占位 Digest 和不安全依赖。
  productionValidation: true
  # 私有 Registry 拉取 Secret 仅按名称引用。
  imagePullSecrets:
    # 示例 Registry Secret 名称。
    - agentark-registry
  # 生产外部 HA 依赖。
  external:
    # MySQL 由 Managed HA 服务或代理提供。
    mysql:
      # 示例 DNS 需替换为真实内部地址。
      host: mysql.database.example.com
      # 固定 TLS 身份校验。
      sslMode: VERIFY_IDENTITY
    # Redis 由 Managed HA 服务提供。
    redis:
      # 示例 DNS 需替换。
      host: redis.cache.example.com
      # 生产应配合客户端 TLS 能力启用。
      tls: true
    # 企业 OIDC Issuer，仅在 identity.mode=oidc 时启用。
    oidc:
      # 绝对 HTTPS Issuer。
      issuerUri: https://identity.example.com
      # 当前示例默认使用 Built-in Identity，不启用外部 OIDC BFF。
      bffEnabled: false
      # 在企业 IdP 中登记的 Confidential Client。
      clientId: agentark-console
      # 面向最终用户的登录入口名称。
      loginLabel: 使用组织身份登录
      # IdP 中精确登记的回调。
      redirectUri: https://agentark.example.com/login/oauth2/code/agentark
      # 登录后进入控制台。
      postLoginRedirectUri: https://agentark.example.com/
      # 退出后回到登录页。
      postLogoutRedirectUri: https://agentark.example.com/sign-in
    # 默认以 MySQL + Redis 内置账号身份部署独立后台。
    identity:
      # 切换为 oidc 时必须同时启用上方 BFF 配置。
      mode: builtin
      # Issuer 与 Web HTTPS Host 保持一致。
      issuerUri: https://agentark.example.com
      # 下游从同源 Gateway 读取只含公钥的 JWK Set。
      jwkSetUri: https://agentark.example.com/api/v1/auth/jwks
  # NetworkPolicy 只能使用 CIDR；示例需替换为真实 Managed Service 和 Provider 网段。
  externalEgressCidrs:
    - 10.0.0.0/8

# 引用平台预创建 Kubernetes Secret；不在 Values 保存值。
secretManagement:
  # External Secrets 关闭时使用现有 Secret。
  existingSecret: agentark-production-secrets
  # 该 Secret 还必须包含 values.yaml 定义的 OIDC Client Secret Key。
  # 启用当前可验证的 Vault KV v2 Secret Resolver。
  vault:
    # 生产运行必须显式开启。
    enabled: true
    # 示例 Vault HTTPS 地址，部署前替换。
    address: https://vault.example.com
    # 示例 KV v2 Mount。
    mount: secret
    # 非 Enterprise 环境保持为空。
    namespace: ""

# 生产共享文件存储必须支持 RWX、快照和跨可用区复制。
objectStorage:
  # 示例 CSI StorageClass。
  storageClassName: rwx-snapshot-replicated
  # 明确要求 ReadWriteMany。
  accessModes:
    # 多副本共享对象存储访问模式。
    - ReadWriteMany

# 生产 Web Host 同时承载静态控制台与同源 BFF 路径。
ingress:
  # 使用集群批准的 IngressClass。
  className: nginx
  # SDK 与机器调用 API Host。
  apiHost: api.agentark.example.com
  # 浏览器 Web、API 与 OIDC Callback 同源 Host。
  webHost: agentark.example.com
  # 引用预创建生产 TLS Secret。
  tlsSecretName: agentark-production-tls

# 所有发布镜像必须替换为 Registry 返回的真实 Digest。
services:
  # Gateway 生产镜像覆盖。
  gateway:
    # Gateway 内容寻址镜像。
    image:
      # 示例 Registry Repository。
      repository: registry.example.com/agentark/agentark-gateway-server
      # 示例非占位 Digest，部署前必须替换为真实值。
      digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      # 生产禁止 Tag。
      tag: ""
  # Control 生产镜像覆盖。
  control:
    # Control 内容寻址镜像。
    image:
      # 示例 Registry Repository。
      repository: registry.example.com/agentark/agentark-control-server
      # 示例非占位 Digest。
      digest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
      # 生产禁止 Tag。
      tag: ""
  # Runtime 生产镜像覆盖。
  runtime:
    # Runtime 内容寻址镜像。
    image:
      # 示例 Registry Repository。
      repository: registry.example.com/agentark/agentark-runtime-server
      # 示例非占位 Digest。
      digest: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      # 生产禁止 Tag。
      tag: ""
  # Scheduler 生产镜像覆盖。
  scheduler:
    # Scheduler 内容寻址镜像。
    image:
      # 示例 Registry Repository。
      repository: registry.example.com/agentark/agentark-scheduler-server
      # 示例非占位 Digest。
      digest: sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
      # 生产禁止 Tag。
      tag: ""
  # Web 生产镜像覆盖。
  web:
    # Web 内容寻址镜像。
    image:
      # 示例 Registry Repository。
      repository: registry.example.com/agentark/agentark-web
      # 示例非占位 Digest。
      digest: sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
      # 生产禁止 Tag。
      tag: ""

# Flyway 批处理镜像同样按 Digest 部署。
migrations:
  # Flyway 内容寻址镜像。
  image:
    # 示例 Registry Repository。
    repository: registry.example.com/agentark/agentark-migrations
    # 示例非占位 Digest。
    digest: sha256:9999999999999999999999999999999999999999999999999999999999999999
    # 生产禁止 Tag。
    tag: ""

# 不可信 Sandbox 使用节点已安装的独立 RuntimeClass。
sandbox:
  # 示例 RuntimeClass 名称。
  runtimeClassName: kata-qemu
  # 示例 CRI Handler。
  runtimeHandler: kata-qemu
