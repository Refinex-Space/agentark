      operationId: diffCatalogVersions
      # Catalog 功能分组。
      tags: [Catalog]
      # 版本标识参数。
      parameters:
        # 基准版本。
        - { name: baseVersionId, in: query, required: true, schema: { $ref: "#/components/schemas/UuidV7" } }
        # 目标版本。
        - { name: targetVersionId, in: query, required: true, schema: { $ref: "#/components/schemas/UuidV7" } }
      # Diff 响应。
      responses:
        # 变化路径。
        "200":
          # 成功说明。
          description: 版本变化 JSON Pointer
          # JSON 响应。
          content:
            # 固定 JSON 媒体类型。
            application/json:
              # Diff 契约。
              schema: { $ref: "#/components/schemas/CatalogVersionDiff" }
        # 未认证。
        "401": { $ref: "#/components/responses/ProblemResponse" }
        # 越权。
        "403": { $ref: "#/components/responses/ProblemResponse" }
        # 版本不存在。
        "404": { $ref: "#/components/responses/ProblemResponse" }
  # 稳定资产归档端点，不物理删除版本。
