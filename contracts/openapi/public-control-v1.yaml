  # 注册 IAM 支持的认证方案。
  securitySchemes:
    # OIDC/JWT Bearer 认证。
    BearerAuth:
      # HTTP 认证类型。
      type: http
      # Bearer 方案。
      scheme: bearer
      # JWT 载荷格式提示。
      bearerFormat: JWT
    # AgentArk API Key Authorization Header 认证。
    ApiKeyAuth:
      # Header API Key 类型。
      type: apiKey
      # 固定 Authorization Header。
      in: header
      # Header 名称。
      name: Authorization
# 所有 IAM 路径默认接受已验证 JWT 或摘要 API Key。
security:
  # Bearer JWT 认证。
  - BearerAuth: []
  # API Key 认证。
  - ApiKeyAuth: []
