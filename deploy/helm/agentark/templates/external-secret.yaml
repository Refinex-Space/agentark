{{- if .Values.secretManagement.externalSecret.enabled }}
# External Secrets Operator 从平台 Secret Store 生成应用 Secret；Values 不携带值。
apiVersion: {{ .Values.secretManagement.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "agentark.fullname" . }}-secrets
  labels:
    {{- include "agentark.labels" (dict "root" . "component" "secret-management") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secretManagement.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required" .Values.secretManagement.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.secretManagement.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "agentark.fullname" . }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- toYaml .Values.secretManagement.externalSecret.data | nindent 4 }}
{{- end }}

