          application/json:
            # 乐观锁契约。
            schema: { $ref: "#/components/schemas/ArchiveCatalogAssetRequest" }
      # 归档结果。
      responses:
        # 归档成功。
        "204": { description: 稳定资产身份已归档，历史版本保留 }
