# Gateway HTTP 服务器配置，公开受认证公共入口和最小 Actuator 探针。
server:
  # 固定本地 Gateway 端口，容器部署可通过 SERVER_PORT 覆盖。
  port: 8080
  # 使关闭流程先停止接收新请求，再等待存量请求完成。
  shutdown: graceful

# Gateway Spring Boot 进程基础属性。
spring:
  # 声明稳定的应用标识，用于日志、指标和服务发现。
  application:
    # Gateway 部署单元的唯一进程名称。
    name: agentark-gateway-server
  # 关闭时允许存量请求退出的最长时间。
  lifecycle:
    # 单个关闭阶段最多等待 20 秒。
    timeout-per-shutdown-phase: 20s
  # 关闭无产品价值的控制台 Banner，减少运行日志噪声。
  main:
    # 不输出 Spring Boot Banner。
    banner-mode: "off"
  # Gateway 只在内置 Identity 启用时使用该 DataSource，且只能连接 agentark_identity。
  datasource:
    # Identity MySQL JDBC URL；禁用内置身份时不会执行连接或迁移。
    url: ${AGENTARK_IDENTITY_DB_URL:jdbc:mysql://localhost:3306/agentark_identity?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    # Identity 独立最小权限账号。
    username: ${AGENTARK_IDENTITY_DB_USERNAME:agentark_identity}
    # Identity 数据库密码只由 Secret 注入。
    password: ${AGENTARK_IDENTITY_DB_PASSWORD:}
    # 固定 MySQL Connector/J 驱动。
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Identity 阻塞 JDBC 只在 boundedElastic 使用，连接池保持严格有界。
    hikari:
      # 指标中的稳定连接池名称。
      pool-name: agentark-identity-pool
      # 密码认证与管理 API 的最大并发数据库连接数。
      maximum-pool-size: ${AGENTARK_IDENTITY_DB_POOL_MAX_SIZE:8}
      # 空闲连接最小值，禁用身份时不会主动连接。
      minimum-idle: ${AGENTARK_IDENTITY_DB_POOL_MIN_IDLE:0}
      # 获取连接最长等待五秒。
      connection-timeout: 5000
      # 会话固定 UTC 与严格 SQL Mode。
      connection-init-sql: "SET SESSION time_zone = '+00:00', SESSION sql_mode = 'STRICT_TRANS_TABLES,ONLY_FULL_GROUP_BY,ERROR_FOR_DIVISION_BY_ZERO,NO_ZERO_DATE,NO_ZERO_IN_DATE,NO_ENGINE_SUBSTITUTION'"
  # Identity 使用独立 Flyway History，禁用身份时不连接数据库。
  flyway:
    # 与内置身份开关一致。
    enabled: ${AGENTARK_GATEWAY_IDENTITY_ENABLED:false}
    # Schema 必须由部署系统预先创建。
    create-schemas: false
    # 禁止 clean 删除账号与安全事件。
    clean-disabled: true
    # 拒绝错误迁移命名。
    validate-migration-naming: true
    # Identity 独占 Schema。
    default-schema: agentark_identity
    # 禁止 Flyway 接触其他平面 Schema。
    schemas: agentark_identity
    # Identity 独立迁移位置。
    locations: classpath:db/migration/identity
    # Identity 独立历史表。
    table: flyway_schema_history
  # Gateway 转发与代理 Header 配置。
  cloud:
    # Spring Cloud Gateway WebFlux Server 配置。
    gateway:
      # 选择响应式 Gateway Server 实现。
      server:
        # WebFlux Gateway 配置根。
        webflux:
          # 禁止接收并传播客户端伪造的 RFC 7239 Forwarded Header。
          forwarded:
            # 不生成 Forwarded Header，统一使用受控 X-Forwarded-*。
            enabled: false
          # 生成下游可读取的 X-Forwarded-*，并覆盖而非追加客户端值。
          x-forwarded:
            # 启用 Gateway 生成的 X-Forwarded-* Header。
            enabled: true
            # 覆盖客户端 X-Forwarded-For，避免来源链伪造。
            for-append: false
            # 覆盖客户端 X-Forwarded-Host。
            host-append: false
            # 覆盖客户端 X-Forwarded-Port。
            port-append: false
            # 覆盖客户端 X-Forwarded-Prefix。
            prefix-append: false
            # 覆盖客户端 X-Forwarded-Proto。
            proto-append: false
  # Redis 保存可丢失的限流窗口和 BFF WebSession，不承载 IAM 或业务事实。
  data:
    # Spring Data Redis 连接配置。
    redis:
      # Redis 主机；生产通过 Secret 管理系统注入真实地址。
      host: ${AGENTARK_REDIS_HOST:localhost}
      # Redis TCP 端口。
      port: ${AGENTARK_REDIS_PORT:6379}
      # 建立 Redis 连接的最长时间。
      connect-timeout: ${AGENTARK_REDIS_CONNECT_TIMEOUT:2s}
      # 单次 Redis 命令的最长时间。
      timeout: ${AGENTARK_REDIS_TIMEOUT:2s}
      # Redis 密码只从 Secret/Config Tree 注入，不进入仓库或普通环境模板。
      password: ${AGENTARK_REDIS_PASSWORD:}
      # Gateway 不声明 Redis Repository，关闭无意义的仓储扫描。
      repositories:
        # 限流直接使用 Foundation 原子端口，不需要 Spring Data Repository。
        enabled: false

# AgentArk Gateway 自有路由、安全缓存和限流配置。
agentark:
  # Gateway 只保存平面 URL 和边缘保护参数，不连接业务数据库。
  gateway:
    # Control Plane 基础地址。
    control-base-url: ${AGENTARK_CONTROL_BASE_URL:http://localhost:8081}
    # Runtime Plane 基础地址。
    runtime-base-url: ${AGENTARK_RUNTIME_BASE_URL:http://localhost:8082}
    # Scheduler Plane 基础地址。
    scheduler-base-url: ${AGENTARK_SCHEDULER_BASE_URL:http://localhost:8083}
    # 普通公共请求体上限。
    max-request-size: ${AGENTARK_GATEWAY_MAX_REQUEST_SIZE:2MB}
    # Webhook 请求体上限，默认比普通请求更严格。
    webhook-max-request-size: ${AGENTARK_GATEWAY_WEBHOOK_MAX_REQUEST_SIZE:1MB}
    # 下游 TCP 连接超时。
    connect-timeout: ${AGENTARK_GATEWAY_CONNECT_TIMEOUT:5s}
    # 普通请求下游响应超时；SSE 路由单独禁用响应超时。
    response-timeout: ${AGENTARK_GATEWAY_RESPONSE_TIMEOUT:30s}
    # API Key 成功验证正缓存 TTL，最大允许三十秒。
    api-key-cache-ttl: ${AGENTARK_GATEWAY_API_KEY_CACHE_TTL:10s}
    # API Key 正缓存容量上限。
    api-key-cache-max-entries: ${AGENTARK_GATEWAY_API_KEY_CACHE_MAX_ENTRIES:10000}
    # 是否启用 Redis 固定窗口限流；生产应显式开启。
    rate-limit-enabled: ${AGENTARK_GATEWAY_RATE_LIMIT_ENABLED:false}
    # 普通公共请求每主体单窗口额度。
    default-rate-limit: ${AGENTARK_GATEWAY_DEFAULT_RATE_LIMIT:600}
    # Webhook 每来源单窗口额度。
    webhook-rate-limit: ${AGENTARK_GATEWAY_WEBHOOK_RATE_LIMIT:120}
    # Redis 固定限流窗口。
    rate-limit-window: ${AGENTARK_GATEWAY_RATE_LIMIT_WINDOW:1m}
    # 浏览器 OIDC BFF 默认关闭，生产或本地身份 Overlay 必须显式完整配置。
    bff:
      # 启用后 Token 只保存在 Redis Session，浏览器仅持有 HttpOnly Cookie。
      enabled: ${AGENTARK_GATEWAY_BFF_ENABLED:false}
      # 登录入口展示名称，不包含协议术语。
      login-label: ${AGENTARK_GATEWAY_BFF_LOGIN_LABEL:使用组织身份登录}
      # 生产应使用 __Host- 前缀；本地 HTTP Profile 使用普通受限名称。
      session-cookie-name: ${AGENTARK_GATEWAY_BFF_SESSION_COOKIE_NAME:AGENTARK_SESSION}
      # 生产必须为 true；本地 HTTP 身份 Profile 可显式关闭。
      session-cookie-secure: ${AGENTARK_GATEWAY_BFF_SESSION_COOKIE_SECURE:true}
      # 生产固定关闭；只允许受控本地身份 Overlay 显式开启。
      insecure-http-enabled: ${AGENTARK_GATEWAY_BFF_INSECURE_HTTP_ENABLED:false}
    # MySQL + Redis 内置账号身份；与外部 OIDC BFF 互斥。
    identity:
      # 默认关闭，由本地/独立部署 Overlay 显式开启。
      enabled: ${AGENTARK_GATEWAY_IDENTITY_ENABLED:false}
      # 内置身份稳定 Issuer，不随主机地址变化。
      issuer: ${AGENTARK_GATEWAY_IDENTITY_ISSUER:https://identity.agentark.local}
      # HttpOnly Redis Session Cookie 名称。
      session-cookie-name: ${AGENTARK_GATEWAY_IDENTITY_SESSION_COOKIE_NAME:AGENTARK_SESSION}
      # 生产必须为 true；本地 HTTP 可显式关闭。
      session-cookie-secure: ${AGENTARK_GATEWAY_IDENTITY_SESSION_COOKIE_SECURE:true}
      # 初始管理员用户名。
      bootstrap-username: ${AGENTARK_GATEWAY_IDENTITY_BOOTSTRAP_USERNAME:agentark-admin}
      # 初始管理员邮箱。
      bootstrap-email: ${AGENTARK_GATEWAY_IDENTITY_BOOTSTRAP_EMAIL:agentark-admin@localhost.invalid}
      # 初始管理员展示名称。
      bootstrap-display-name: ${AGENTARK_GATEWAY_IDENTITY_BOOTSTRAP_DISPLAY_NAME:AgentArk Administrator}
      # 初始随机密码、Pepper 与 RSA 私钥必须由 Config Tree Secret 注入。
      bootstrap-password: ${AGENTARK_GATEWAY_IDENTITY_BOOTSTRAP_PASSWORD:}
      password-pepper: ${AGENTARK_GATEWAY_IDENTITY_PASSWORD_PEPPER:}
      signing-private-key: ${AGENTARK_GATEWAY_IDENTITY_SIGNING_PRIVATE_KEY:}
      # JWT Key ID 用于轮换期间选择公钥。
      signing-key-id: ${AGENTARK_GATEWAY_IDENTITY_SIGNING_KEY_ID:agentark-local-rs256-v1}
      # 下游内部 JWT 最长九十秒。
      access-token-ttl: ${AGENTARK_GATEWAY_IDENTITY_ACCESS_TOKEN_TTL:90s}
      # 单因素密码最少十五个 Unicode Code Point。
      password-min-length: ${AGENTARK_GATEWAY_IDENTITY_PASSWORD_MIN_LENGTH:15}
      # 支持密码管理器长口令但限制请求内存。
      password-max-length: ${AGENTARK_GATEWAY_IDENTITY_PASSWORD_MAX_LENGTH:128}
      # 连续五次失败进入自动锁定。
      failure-threshold: ${AGENTARK_GATEWAY_IDENTITY_FAILURE_THRESHOLD:5}
      # 默认锁定十五分钟。
      lock-duration: ${AGENTARK_GATEWAY_IDENTITY_LOCK_DURATION:15m}
  # Foundation 安全基线；启用时还必须注入 Issuer/JWK 配置。
  foundation:
    # JWT Resource Server 配置。
    security:
      # 默认失败关闭；生产必须设置为 true 并提供可信 Issuer 或 JWK Set URI。
      enabled: ${AGENTARK_GATEWAY_SECURITY_ENABLED:false}
      # 受信 Issuer；生产只允许 HTTPS。
      issuer-uri: ${AGENTARK_FOUNDATION_SECURITY_ISSUER_URI:}
      # 可选显式 JWK Set；本地容器使用内部 DNS，生产通常使用 Discovery。
      jwk-set-uri: ${AGENTARK_FOUNDATION_SECURITY_JWK_SET_URI:}
      # 生产固定关闭；只供受控本地身份 Profile 使用。
      insecure-http-enabled: ${AGENTARK_FOUNDATION_SECURITY_INSECURE_HTTP_ENABLED:false}
      # Gateway 只接受面向自身 Audience 的 JWT。
      audiences:
        - ${AGENTARK_GATEWAY_JWT_AUDIENCE:agentark-gateway}
      # 明确限制非对称 JWS 算法，拒绝 none 与 HMAC 降级。
      allowed-jws-algorithms:
        - ${AGENTARK_GATEWAY_JWS_ALGORITHM:RS256}
    # Redis Foundation 在限流或 BFF Session 启用时开启。
    redis:
      # 限流或 BFF 任一启用后缺少 Redis 将失败关闭请求。
      enabled: ${AGENTARK_GATEWAY_REDIS_HEALTH_ENABLED:${AGENTARK_GATEWAY_RATE_LIMIT_ENABLED:false}}
      # Redis Key 应用级命名空间。
      application-name: gateway

# Actuator 对外暴露与健康信息脱敏策略。
management:
  # 限流或 BFF Session 启用时把 Redis 纳入整体健康状态，避免会话基础设施缺失时仍报告就绪。
  health:
    # Redis 健康贡献者配置。
    redis:
      # 与 Redis 会话/限流开关一致；启用后 Redis 故障必须使 Readiness 失败。
      enabled: ${AGENTARK_GATEWAY_REDIS_HEALTH_ENABLED:${AGENTARK_GATEWAY_RATE_LIMIT_ENABLED:false}}
    # 仅内置 Identity 启用时把 MySQL 纳入 Readiness。
    db:
      # 禁用 Identity 的纯代理模式不连接数据库。
      enabled: ${AGENTARK_GATEWAY_IDENTITY_ENABLED:false}
  # 管理 HTTP 端点的暴露范围。
  endpoints:
    # 只管理 Web 端点暴露行为。
    web:
      # 显式限制可访问端点，禁止环境与 Bean 信息泄露。
      exposure:
        # 暴露健康、构建和 Prometheus；Gateway 路由永不代理管理端点。
        include: health,info,prometheus
  # Micrometer Tracing 只生产和消费 W3C Trace Context。
  tracing:
    # 未配置 Collector 时关闭 Export，认证和路由不依赖 Telemetry Backend。
    export:
      # 生产由部署配置显式开启。
      enabled: ${AGENTARK_OTEL_EXPORT_ENABLED:false}
    # 统一传播格式。
    propagation:
      # 仅使用 W3C Trace Context。
      type: W3C
    # Trace 采样策略。
    sampling:
      # 默认采样 10%，安全拒绝仍由日志与 Audit 记录。
      probability: ${AGENTARK_OTEL_SAMPLING_PROBABILITY:0.1}
  # Spring Boot OpenTelemetry SDK 与 OTLP Exporter 配置。
  opentelemetry:
    # OTel Trace 设置。
    tracing:
      # 有界批处理 Export 配置。
      export:
        # 队列满时丢弃 Span，不阻断公共请求。
        max-queue-size: 2048
        # 每批最多 512 个 Span。
        max-batch-size: 512
        # OTLP/HTTP Collector 配置。
        otlp:
          # Collector Trace 接口；仅在 Export 开启时使用。
          endpoint: ${AGENTARK_OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          # 连接超时。
          connect-timeout: 3s
          # 单批提交总超时。
          timeout: 5s
  # 单个管理端点的安全行为。
  endpoint:
    # 健康端点必须支持编排器探针且不暴露内部细节。
    health:
      # 启用 `/actuator/health/liveness` 和 `/actuator/health/readiness` 分组。
      probes:
        # 无论是否运行在 Kubernetes 都开启探针分组。
        enabled: true
      # 匿名健康响应只返回整体状态，不显示组件或配置。
      show-details: never
  # Info 端点只提供可审计且非敏感的构建元数据。
  info:
    # 允许 Spring Boot Maven Plugin 生成的 Build Info。
    build:
      # 开启构建信息贡献者。
      enabled: true
    # 不展示主机 Java 运行时细节。
    java:
      # 关闭 Java Info 贡献者。
      enabled: false
    # 禁止将环境变量或配置映射到 Info 端点。
    env:
      # 关闭 Env Info 贡献者。
      enabled: false
