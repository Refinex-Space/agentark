# Phase 19 本地 Observability Profile；生产部署必须由 Phase 22 重新建模。
name: agentark-observability

# 声明本地 Trace、Metric 与 Dashboard 服务。
services:
  # OpenTelemetry Collector 接收四服务 OTLP，并转发 Trace 到 Tempo。
  otel-collector:
    # 固定官方 Contrib Collector 版本，不跟随 latest。
    image: otel/opentelemetry-collector-contrib:0.153.0
    # 使用只读配置启动 Collector。
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    # 只挂载仓库内受版本控制的配置。
    volumes:
      - ./otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    # 仅绑定本机回环地址，避免开发 Collector 暴露到局域网。
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    # Collector 必须先等待 Tempo 接收端就绪。
    depends_on:
      # Tempo 健康后再启动转发。
      tempo:
        condition: service_healthy
    # 使用 Collector 自身 Health Check Extension。
    healthcheck:
      # 检查只读健康端点。
      test: ["CMD", "/otelcol-contrib", "components"]
      # 每十秒检查一次。
      interval: 10s
      # 单次最多等待五秒。
      timeout: 5s
      # 连续五次失败才标记不健康。
      retries: 5

  # Tempo 仅作为本地 Trace 后端，不保存 Audit 或 Runtime Event。
  tempo:
    # 固定维护中的 2.10 补丁版本，避免未评审 3.x 迁移行为。
    image: grafana/tempo:2.10.7
    # 使用单二进制本地配置。
    command: ["-config.file=/etc/tempo.yml"]
    # 挂载只读配置和持久 Trace 卷。
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    # 只把查询端口绑定到本机。
    ports:
      - "127.0.0.1:3200:3200"
    # 使用 Tempo Ready 端点检查服务状态。
    healthcheck:
      # 容器内查询 Ready 状态。
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3200/ready"]
      # 每十秒检查一次。
      interval: 10s
      # 单次最多等待五秒。
      timeout: 5s
      # 连续十次失败才标记不健康。
      retries: 10

  # Prometheus 抓取四服务和 Collector 的低基数指标。
  prometheus:
    # 固定官方稳定版本，不使用 latest 标签。
    image: prom/prometheus:v3.12.0
    # 使用只读配置和告警规则。
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    # 挂载配置、告警与持久 Metric 卷。
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    # Linux Docker 通过 host-gateway 访问宿主四服务。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 只把 Prometheus UI 绑定到本机。
    ports:
      - "127.0.0.1:9090:9090"
    # 使用健康端点验证配置加载。
    healthcheck:
      # 查询 Prometheus Ready 状态。
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/ready"]
      # 每十秒检查一次。
      interval: 10s
      # 单次最多等待五秒。
      timeout: 5s
      # 连续五次失败才标记不健康。
      retries: 5

  # Grafana 展示预置 Prometheus/Tempo 数据源和 AgentArk Dashboard。
  grafana:
    # 固定官方稳定版本，不使用 latest 标签。
    image: grafana/grafana:13.1.0
    # 通过环境变量配置本地管理员；密码必须由本地 Secret 注入。
    environment:
      # 固定本地管理员账号名称，不作为生产身份模型。
      GF_SECURITY_ADMIN_USER: agentark-local-admin
      # 密码没有默认值，Compose 启动前必须显式提供。
      GF_SECURITY_ADMIN_PASSWORD: ${AGENTARK_GRAFANA_ADMIN_PASSWORD:?required}
      # 禁止匿名访问 Dashboard。
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # 禁止自动注册外部用户。
      GF_USERS_ALLOW_SIGN_UP: "false"
    # 挂载只读 Provisioning 与持久数据卷。
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # 只把 Grafana 绑定到本机 3001，避免占用 Web 开发端口。
    ports:
      - "127.0.0.1:3001:3000"
    # 等待 Prometheus 和 Tempo 都可用。
    depends_on:
      # Metric 数据源健康后启动。
      prometheus:
        condition: service_healthy
      # Trace 数据源健康后启动。
      tempo:
        condition: service_healthy
    # 查询 Grafana Health API。
    healthcheck:
      # 使用镜像内 wget 检查数据库与 HTTP 状态。
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/health"]
      # 每十秒检查一次。
      interval: 10s
      # 单次最多等待五秒。
      timeout: 5s
      # 连续十次失败才标记不健康。
      retries: 10

# 声明本地开发持久卷；这些卷不是业务事实备份。
volumes:
  # Tempo Trace 本地数据。
  tempo-data:
  # Prometheus TSDB 本地数据。
  prometheus-data:
  # Grafana 本地配置数据库。
  grafana-data:
