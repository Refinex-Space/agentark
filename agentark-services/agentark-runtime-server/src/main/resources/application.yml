# Runtime HTTP 服务器配置，公开受保护的 Runtime API 与脱敏 Actuator 端点。
server:
  # 固定本地 Runtime 端口，容器部署可通过 SERVER_PORT 覆盖。
  port: 8082
  # 使关闭流程先停止接收新请求，再等待存量请求完成。
  shutdown: graceful

# Runtime Spring Boot 进程基础属性。
spring:
  # 声明稳定的应用标识，用于日志、指标和服务发现。
  application:
    # Runtime 部署单元的唯一进程名称。
    name: agentark-runtime-server
  # 关闭时允许存量请求退出的最长时间。
  lifecycle:
    # 单个关闭阶段最多等待 20 秒。
    timeout-per-shutdown-phase: 20s
  # 关闭无产品价值的控制台 Banner，减少运行日志噪声。
  main:
    # 不输出 Spring Boot Banner。
    banner-mode: "off"

# Actuator 对外暴露与健康信息脱敏策略。
management:
  # 管理 HTTP 端点的暴露范围。
  endpoints:
    # 只管理 Web 端点暴露行为。
    web:
      # 显式限制可访问端点，禁止环境与 Bean 信息泄露。
      exposure:
        # 暴露健康、构建和 Prometheus；Runtime 业务 API 不经 Actuator 暴露。
        include: health,info,prometheus
  # Micrometer Tracing 只生产和消费 W3C Trace Context。
  tracing:
    # 未配置 Collector 时关闭 Export，已有 Run 不依赖 Telemetry Backend。
    export:
      # 生产由部署配置显式开启。
      enabled: ${AGENTARK_OTEL_EXPORT_ENABLED:false}
    # 统一跨四服务传播格式。
    propagation:
      # 仅使用 W3C Trace Context。
      type: W3C
    # Trace 采样策略。
    sampling:
      # 默认采样 10%，Runtime Event 与 Usage 不受采样影响。
      probability: ${AGENTARK_OTEL_SAMPLING_PROBABILITY:0.1}
  # Spring Boot OpenTelemetry SDK 与 OTLP Exporter 配置。
  opentelemetry:
    # OTel Trace 设置。
    tracing:
      # 有界批处理 Export 配置。
      export:
        # 队列满时丢弃 Span，不阻断模型或事件持久化。
        max-queue-size: 2048
        # 每批最多 512 个 Span。
        max-batch-size: 512
        # OTLP/HTTP Collector 配置。
        otlp:
          # Collector Trace 接口；仅在 Export 开启时使用。
          endpoint: ${AGENTARK_OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          # 连接超时。
          connect-timeout: 3s
          # 单批提交总超时。
          timeout: 5s
  # 单个管理端点的安全行为。
  endpoint:
    # 健康端点必须支持编排器探针且不暴露内部细节。
    health:
      # 启用 `/actuator/health/liveness` 和 `/actuator/health/readiness` 分组。
      probes:
        # 无论是否运行在 Kubernetes 都开启探针分组。
        enabled: true
      # 匿名健康响应只返回整体状态，不显示组件或配置。
      show-details: never
  # Info 端点只提供可审计且非敏感的构建元数据。
  info:
    # 允许 Spring Boot Maven Plugin 生成的 Build Info。
    build:
      # 开启构建信息贡献者。
      enabled: true
    # 不展示主机 Java 运行时细节。
    java:
      # 关闭 Java Info 贡献者。
      enabled: false
    # 禁止将环境变量或配置映射到 Info 端点。
    env:
      # 关闭 Env Info 贡献者。
      enabled: false

---
# Runtime 持久化生产模板；测试 Profile 显式排除真实数据库接线。
spring:
  # 限制本配置文档不在无外部基础设施的上下文测试中加载。
  config:
    # 声明 Profile 激活表达式。
    activate:
      # 除 test 外的运行环境必须显式提供 Runtime 数据库凭据。
      on-profile: "!test"
  # Runtime 只连接 agentark_runtime，URL、账号和密码均无生产默认值。
  datasource:
    # Runtime MySQL JDBC URL，必须指向 agentark_runtime。
    url: ${AGENTARK_RUNTIME_DB_URL}
    # Runtime 最小权限数据库账号。
    username: ${AGENTARK_RUNTIME_DB_USERNAME}
    # Runtime 数据库密码，只能由 Secret 注入。
    password: ${AGENTARK_RUNTIME_DB_PASSWORD}
    # 固定 MySQL Connector/J 驱动。
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Runtime HikariCP 有界连接池配置。
    hikari:
      # 连接池稳定名称，用于指标区分三个 Owner。
      pool-name: agentark-runtime-pool
      # 最大连接数可按部署容量覆盖。
      maximum-pool-size: ${AGENTARK_RUNTIME_DB_POOL_MAX_SIZE:20}
      # 最小空闲连接保持为 1，避免空业务环境占用过多连接。
      minimum-idle: ${AGENTARK_RUNTIME_DB_POOL_MIN_IDLE:1}
      # 获取连接最多等待 5000 毫秒；Hikari 原生属性使用毫秒整数。
      connection-timeout: 5000
      # 连接校验最多等待 3000 毫秒；Hikari 原生属性使用毫秒整数。
      validation-timeout: 3000
      # 连接最长存活 1800000 毫秒，低于常见服务端回收周期。
      max-lifetime: 1800000
      # 每 120000 毫秒保持低流量连接活跃。
      keepalive-time: 120000
      # 每条新连接固定 UTC 和严格模式，禁止依赖实例隐式默认值。
      connection-init-sql: "SET SESSION time_zone = '+00:00', SESSION sql_mode = 'STRICT_TRANS_TABLES,ONLY_FULL_GROUP_BY,ERROR_FOR_DIVISION_BY_ZERO,NO_ZERO_DATE,NO_ZERO_IN_DATE,NO_ENGINE_SUBSTITUTION'"
  # Runtime Flyway 只读取 Runtime Location，并在所属 Schema 保存独立历史。
  flyway:
    # 应用启动时执行受版本控制的迁移。
    enabled: true
    # 禁止自动创建 Schema；部署系统必须预先创建并授权。
    create-schemas: false
    # 禁止运行期 clean 删除数据库对象。
    clean-disabled: true
    # 拒绝不符合 Flyway 命名规范的迁移文件。
    validate-migration-naming: true
    # Runtime 默认 Schema。
    default-schema: agentark_runtime
    # Runtime 允许管理的唯一 Schema。
    schemas: agentark_runtime
    # Runtime 独占 Migration Location。
    locations: classpath:db/migration/runtime
    # 在 agentark_runtime 内使用标准且独立的历史表名。
    table: flyway_schema_history
  # Spring Data Redis 连接只读取本服务运行环境，Redis 不是 Runtime 权威存储。
  data:
    # Redis 8.10.x 连接配置。
    redis:
      # Redis 主机名；Compose 使用服务 DNS 覆盖。
      host: ${AGENTARK_REDIS_HOST:localhost}
      # Redis 标准端口。
      port: ${AGENTARK_REDIS_PORT:6379}
      # Redis 密码无默认值，本地无密码时保持空。
      password: ${AGENTARK_REDIS_PASSWORD:}
      # 连接与命令超时上限。
      timeout: 3s

# MyBatis-Plus 生产日志不得输出 SQL 正文或绑定参数。
mybatis-plus:
  # MyBatis 原生配置。
  configuration:
    # 数据对象字段按下划线列名映射。
    map-underscore-to-camel-case: true
    # 禁用 MyBatis SQL 文本日志，慢查询由脱敏遥测插件记录。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# Runtime 持久化纵深防御和慢查询基线。
agentark:
  # Runtime API、Worker、Control Client 与 Instance 配置。
  runtime:
    # Control Internal API 地址；非测试 Profile 必须可解析。
    control-base-url: ${AGENTARK_CONTROL_BASE_URL:http://localhost:8081}
    # 服务身份 Token 无默认值，只能由 Secret 注入并进入 Authorization Header。
    internal-service-token: ${AGENTARK_RUNTIME_INTERNAL_TOKEN:}
    # 单实例稳定 Key；多实例部署必须由 Pod 名或实例 ID 覆盖。
    instance-key: ${AGENTARK_RUNTIME_INSTANCE_KEY:runtime-local-1}
    # MySQL 与 Redis 双层 Lease 的有效期。
    lease-ttl: ${AGENTARK_RUNTIME_LEASE_TTL:30s}
    # 默认不启动真实 Worker，生产 SPI 齐备后必须显式开启。
    worker-enabled: ${AGENTARK_RUNTIME_WORKER_ENABLED:false}
    # 持久 Work Queue 无任务时的轮询间隔。
    worker-poll-delay: ${AGENTARK_RUNTIME_WORKER_POLL_DELAY:250ms}
    # Runtime Instance 心跳间隔。
    instance-heartbeat-delay: ${AGENTARK_RUNTIME_HEARTBEAT_DELAY:10s}
    # 是否启动 Runtime Usage 到 Control Governance 的可靠汇聚 Worker。
    usage-governance-enabled: ${AGENTARK_RUNTIME_USAGE_GOVERNANCE_ENABLED:false}
    # Usage 汇聚 Worker 两轮扫描的固定延迟。
    usage-governance-delay: ${AGENTARK_RUNTIME_USAGE_GOVERNANCE_DELAY:5s}
  # Foundation Starter 配置。
  foundation:
    # JWT 安全失败默认：关闭时 Runtime API 全部拒绝，只开放健康端点。
    security:
      # 生产必须显式开启并提供 Issuer/JWK 与 Audience。
      enabled: ${AGENTARK_RUNTIME_SECURITY_ENABLED:false}
    # Redis 只承载 Lease、通知和可丢失加速状态。
    redis:
      # Runtime 非测试 Profile 启用 Redis 原子协调能力。
      enabled: true
      # 固定 Runtime Redis Key 应用命名空间，避免与其他平面冲突。
      application-name: runtime
    # Local Object Store 仅作为本地基础实现，生产可用 S3-compatible Bean 替换。
    storage:
      # 启用受控 ObjectRef 写入能力。
      enabled: true
      # Local ObjectRef 的稳定 Authority。
      authority: ${AGENTARK_RUNTIME_OBJECT_AUTHORITY:runtime-local}
      # 本地对象专用目录，已由 `.gitignore` 排除 `.agentark/`。
      root: ${AGENTARK_RUNTIME_OBJECT_ROOT:.agentark/data/runtime-objects}
    # 持久化增强配置。
    persistence:
      # 存在 Runtime TenantLineHandler 时启用租户 SQL 防御。
      tenant-defense-enabled: true
      # 只采集语句类别、结果和耗时。
      sql-telemetry-enabled: true
      # 超过 500 毫秒输出不含 SQL/参数的慢查询告警。
      slow-query-threshold: 500ms
