{{- if .Values.serviceAccount.create }}
{{- range $component := list "gateway" "control" "runtime" "scheduler" "web" }}
# {{ $component }} 使用独立 ServiceAccount，默认不挂载 API Token。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentark.serviceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "agentark.labels" (dict "root" $ "component" $component) | nindent 4 }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
# {{ $component }} 默认没有 Kubernetes API 权限；云工作负载身份通过 ServiceAccount 注解提供。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentark.componentName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "agentark.labels" (dict "root" $ "component" $component) | nindent 4 }}
rules: []
---
# 将空权限 Role 绑定到对应 ServiceAccount，防止未来误用默认账号权限。
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentark.componentName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "agentark.labels" (dict "root" $ "component" $component) | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "agentark.serviceAccountName" (dict "root" $ "component" $component) }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agentark.componentName" (dict "root" $ "component" $component) }}
---
{{- end }}
{{- end }}

