# Scheduler 管理、Internal、Webhook 与 Actuator HTTP 服务器配置。
server:
  # 固定本地 Scheduler 端口，容器部署可通过 SERVER_PORT 覆盖。
  port: 8083
  # 使关闭流程先停止接收新请求，再等待存量请求完成。
  shutdown: graceful

# Scheduler Spring Boot 进程基础属性。
spring:
  # 声明稳定的应用标识，用于日志、指标和服务发现。
  application:
    # Scheduler 部署单元的唯一进程名称。
    name: agentark-scheduler-server
  # 关闭时允许存量请求退出的最长时间。
  lifecycle:
    # 单个关闭阶段最多等待 20 秒。
    timeout-per-shutdown-phase: 20s
  # 关闭无产品价值的控制台 Banner，减少运行日志噪声。
  main:
    # 不输出 Spring Boot Banner。
    banner-mode: "off"

# Actuator 对外暴露与健康信息脱敏策略。
management:
  # 管理 HTTP 端点的暴露范围。
  endpoints:
    # 只管理 Web 端点暴露行为。
    web:
      # 显式限制可访问端点，禁止环境与 Bean 信息泄露。
      exposure:
        # 暴露健康、构建和 Prometheus；生产网络策略必须限制管理端口。
        include: health,info,prometheus
  # Micrometer Tracing 只生产和消费 W3C Trace Context。
  tracing:
    # 未配置 Collector 时关闭 Export，Job 状态不依赖 Telemetry Backend。
    export:
      # 生产由部署配置显式开启。
      enabled: ${AGENTARK_OTEL_EXPORT_ENABLED:false}
    # 统一传播格式。
    propagation:
      # 仅使用 W3C Trace Context。
      type: W3C
    # Trace 采样策略。
    sampling:
      # 默认采样 10%，Scheduler Audit Outbox 不受采样影响。
      probability: ${AGENTARK_OTEL_SAMPLING_PROBABILITY:0.1}
  # Spring Boot OpenTelemetry SDK 与 OTLP Exporter 配置。
  opentelemetry:
    # OTel Trace 设置。
    tracing:
      # 有界批处理 Export 配置。
      export:
        # 队列满时丢弃 Span，不阻断 Job 状态提交。
        max-queue-size: 2048
        # 每批最多 512 个 Span。
        max-batch-size: 512
        # OTLP/HTTP Collector 配置。
        otlp:
          # Collector Trace 接口；仅在 Export 开启时使用。
          endpoint: ${AGENTARK_OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          # 连接超时。
          connect-timeout: 3s
          # 单批提交总超时。
          timeout: 5s
  # 单个管理端点的安全行为。
  endpoint:
    # 健康端点必须支持编排器探针且不暴露内部细节。
    health:
      # 启用 `/actuator/health/liveness` 和 `/actuator/health/readiness` 分组。
      probes:
        # 无论是否运行在 Kubernetes 都开启探针分组。
        enabled: true
      # 匿名健康响应只返回整体状态，不显示组件或配置。
      show-details: never
  # Info 端点只提供可审计且非敏感的构建元数据。
  info:
    # 允许 Spring Boot Maven Plugin 生成的 Build Info。
    build:
      # 开启构建信息贡献者。
      enabled: true
    # 不展示主机 Java 运行时细节。
    java:
      # 关闭 Java Info 贡献者。
      enabled: false
    # 禁止将环境变量或配置映射到 Info 端点。
    env:
      # 关闭 Env Info 贡献者。
      enabled: false

---
# Scheduler 持久化生产模板；测试 Profile 显式排除真实数据库接线。
spring:
  # 限制本配置文档不在无外部基础设施的上下文测试中加载。
  config:
    # 声明 Profile 激活表达式。
    activate:
      # 除 test 外的运行环境必须显式提供 Scheduler 数据库凭据。
      on-profile: "!test"
  # Scheduler 只连接 agentark_scheduler，URL、账号和密码均无生产默认值。
  datasource:
    # Scheduler MySQL JDBC URL，必须指向 agentark_scheduler。
    url: ${AGENTARK_SCHEDULER_DB_URL}
    # Scheduler 最小权限数据库账号。
    username: ${AGENTARK_SCHEDULER_DB_USERNAME}
    # Scheduler 数据库密码，只能由 Secret 注入。
    password: ${AGENTARK_SCHEDULER_DB_PASSWORD}
    # 固定 MySQL Connector/J 驱动。
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Scheduler HikariCP 有界连接池配置。
    hikari:
      # 连接池稳定名称，用于指标区分三个 Owner。
      pool-name: agentark-scheduler-pool
      # 最大连接数可按部署容量覆盖。
      maximum-pool-size: ${AGENTARK_SCHEDULER_DB_POOL_MAX_SIZE:10}
      # 最小空闲连接保持为 1，避免空业务环境占用过多连接。
      minimum-idle: ${AGENTARK_SCHEDULER_DB_POOL_MIN_IDLE:1}
      # 获取连接最多等待 5000 毫秒；Hikari 原生属性使用毫秒整数。
      connection-timeout: 5000
      # 连接校验最多等待 3000 毫秒；Hikari 原生属性使用毫秒整数。
      validation-timeout: 3000
      # 连接最长存活 1800000 毫秒，低于常见服务端回收周期。
      max-lifetime: 1800000
      # 每 120000 毫秒保持低流量连接活跃。
      keepalive-time: 120000
      # 每条新连接固定 UTC 和严格模式，禁止依赖实例隐式默认值。
      connection-init-sql: "SET SESSION time_zone = '+00:00', SESSION sql_mode = 'STRICT_TRANS_TABLES,ONLY_FULL_GROUP_BY,ERROR_FOR_DIVISION_BY_ZERO,NO_ZERO_DATE,NO_ZERO_IN_DATE,NO_ENGINE_SUBSTITUTION'"
  # Scheduler Flyway 只读取 Scheduler Location，并在所属 Schema 保存独立历史。
  flyway:
    # 应用启动时执行受版本控制的迁移。
    enabled: true
    # 禁止自动创建 Schema；部署系统必须预先创建并授权。
    create-schemas: false
    # 禁止运行期 clean 删除数据库对象。
    clean-disabled: true
    # 拒绝不符合 Flyway 命名规范的迁移文件。
    validate-migration-naming: true
    # Scheduler 默认 Schema。
    default-schema: agentark_scheduler
    # Scheduler 允许管理的唯一 Schema。
    schemas: agentark_scheduler
    # Scheduler 独占 Migration Location。
    locations: classpath:db/migration/scheduler
    # 在 agentark_scheduler 内使用标准且独立的历史表名。
    table: flyway_schema_history

# MyBatis-Plus 生产日志不得输出 SQL 正文或绑定参数。
mybatis-plus:
  # MyBatis 原生配置。
  configuration:
    # 数据对象字段按下划线列名映射。
    map-underscore-to-camel-case: true
    # 禁用 MyBatis SQL 文本日志，慢查询由脱敏遥测插件记录。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# Scheduler 持久化纵深防御和慢查询基线。
agentark:
  # Foundation Starter 配置。
  foundation:
    # Scheduler 安全失败默认配置。
    security:
      # 默认关闭管理与 Internal API；Webhook 仍必须通过 HMAC 验签。
      enabled: ${AGENTARK_SECURITY_ENABLED:false}
    # 持久化增强配置。
    persistence:
      # 存在 Scheduler TenantLineHandler 时启用租户 SQL 防御。
      tenant-defense-enabled: true
      # 只采集语句类别、结果和耗时。
      sql-telemetry-enabled: true
      # 超过 500 毫秒输出不含 SQL/参数的慢查询告警。
      slow-query-threshold: 500ms
  # Scheduler Plane 的版本化 Client、Lease 与 Worker 配置。
  scheduler:
    # Control v1 Internal API 基础地址；生产部署应覆盖为集群内受控地址。
    control-base-url: ${AGENTARK_CONTROL_BASE_URL:http://localhost:8081}
    # Runtime v1 Internal API 基础地址；生产部署应覆盖为集群内受控地址。
    runtime-base-url: ${AGENTARK_RUNTIME_BASE_URL:http://localhost:8082}
    # Audience 受限短期服务身份 Token；空值不会启用任何弱认证回退。
    internal-service-token: ${AGENTARK_SCHEDULER_INTERNAL_TOKEN:}
    # Worker 稳定实例 Key；容器环境应覆盖为 Pod 或实例稳定标识。
    instance-key: ${AGENTARK_SCHEDULER_INSTANCE_KEY:agentark-scheduler-local}
    # 单次 Job Lease 有效期，Worker 每三分之一周期续租。
    lease-ttl: ${AGENTARK_SCHEDULER_LEASE_TTL:30s}
    # 默认不启动 Worker，避免未配置 Provider 或内部服务身份时领取任务。
    worker-enabled: ${AGENTARK_SCHEDULER_WORKER_ENABLED:false}
    # 没有可 Claim Job 时的轮询间隔。
    worker-poll-delay: ${AGENTARK_SCHEDULER_WORKER_POLL_DELAY:1s}
    # Cron Cursor 扫描间隔。
    cron-scan-delay: ${AGENTARK_SCHEDULER_CRON_SCAN_DELAY:30s}
    # 每个 Job Type 的隔离 Worker 数。
    worker-pool-size: ${AGENTARK_SCHEDULER_WORKER_POOL_SIZE:2}
