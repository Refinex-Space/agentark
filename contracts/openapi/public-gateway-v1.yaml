# 声明本文档遵循 OpenAPI 3.1.0。
openapi: 3.1.0
# 描述 Gateway 浏览器身份与会话 API。
info:
  # 标识 Gateway Identity 契约。
  title: AgentArk Gateway Identity API
  # 声明独立 Gateway 契约版本。
  version: 1.0.0
  # 说明浏览器边界不返回任何 Bearer Token 或密码摘要。
  description: 提供 Built-in Identity 密码登录、首次改密、Redis Session、账号治理、安全事件与可选 OIDC BFF；只在创建或重置的首次成功响应交付临时密码。
# 固定内联 Schema 方言。
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
# 声明公共身份路径。
paths:
  # 查询当前匿名或已认证浏览器会话。
  /api/v1/auth/session:
    # 定义 get 身份契约节点的用途与约束。
    get:
      # 定义 operationId 身份契约节点的用途与约束。
      operationId: getGatewaySession
      # 定义 tags 身份契约节点的用途与约束。
      tags: [GatewaySession]
      # 定义 responses 身份契约节点的用途与约束。
      responses:
        # 定义 200 身份契约节点的用途与约束。
        "200":
          # 定义 description 身份契约节点的用途与约束。
          description: 当前浏览器安全会话与 CSRF 参数
          # 定义 content 身份契约节点的用途与约束。
          content:
            # 定义 application/json 身份契约节点的用途与约束。
            application/json:
              # 定义 schema 身份契约节点的用途与约束。
              schema: { $ref: "#/components/schemas/GatewaySessionResponse" }
        # 定义 500 身份契约节点的用途与约束。
        "500": { $ref: "#/components/responses/ProblemResponse" }
  # 使用用户名或电子邮箱和密码登录。
  /api/v1/auth/login:
    # 定义 post 身份契约节点的用途与约束。
    post:
      # 定义 operationId 身份契约节点的用途与约束。
      operationId: loginWithPassword
      # 定义 tags 身份契约节点的用途与约束。
      tags: [GatewayIdentity]
      # 定义 security 身份契约节点的用途与约束。
      security: [{ CsrfHeader: [] }]
      # 定义 requestBody 身份契约节点的用途与约束。
      requestBody:
        # 定义 required 身份契约节点的用途与约束。
        required: true
        # 定义 content 身份契约节点的用途与约束。
        content:
          # 定义 application/json 身份契约节点的用途与约束。
          application/json:
            # 定义 schema 身份契约节点的用途与约束。
            schema: { $ref: "#/components/schemas/LoginRequest" }
      # 定义 responses 身份契约节点的用途与约束。
      responses:
        # 定义 200 身份契约节点的用途与约束。
        "200":
          # 定义 description 身份契约节点的用途与约束。
          description: 已建立完整 Redis Session
          # 定义 content 身份契约节点的用途与约束。
          content:
            # 定义 application/json 身份契约节点的用途与约束。
            application/json:
              # 定义 schema 身份契约节点的用途与约束。
              schema: { $ref: "#/components/schemas/LoginResponse" }
        # 定义 401 身份契约节点的用途与约束。
        "401": { $ref: "#/components/responses/ProblemResponse" }
        # 定义 428 身份契约节点的用途与约束。
        "428":
          # 定义 description 身份契约节点的用途与约束。
          description: 临时密码正确，但必须先修改密码
          # 定义 content 身份契约节点的用途与约束。
          content:
            # 定义 application/json 身份契约节点的用途与约束。
            application/json:
              # 定义 schema 身份契约节点的用途与约束。
              schema: { $ref: "#/components/schemas/LoginResponse" }
        # 定义 429 身份契约节点的用途与约束。
        "429": { $ref: "#/components/responses/ProblemResponse" }
  # 完成临时密码的首次强制修改。
  /api/v1/auth/required-password-change:
    # 定义 post 身份契约节点的用途与约束。
    post:
      # 定义 operationId 身份契约节点的用途与约束。
      operationId: completeRequiredPasswordChange
      # 定义 tags 身份契约节点的用途与约束。
      tags: [GatewayIdentity]
      # 定义 security 身份契约节点的用途与约束。
      security: [{ SessionCookie: [], CsrfHeader: [] }]
      # 定义 requestBody 身份契约节点的用途与约束。
      requestBody:
        # 定义 required 身份契约节点的用途与约束。
        required: true
        # 定义 content 身份契约节点的用途与约束。
        content:
          # 定义 application/json 身份契约节点的用途与约束。
          application/json:
            # 定义 schema 身份契约节点的用途与约束。
            schema: { $ref: "#/components/schemas/PasswordChangeRequest" }
      # 定义 responses 身份契约节点的用途与约束。
      responses:
        # 定义 200 身份契约节点的用途与约束。
        "200":
          # 定义 description 身份契约节点的用途与约束。
          description: 正式密码已持久化并建立完整 Session
          # 定义 content 身份契约节点的用途与约束。
          content:
            # 定义 application/json 身份契约节点的用途与约束。
            application/json:
              # 定义 schema 身份契约节点的用途与约束。
              schema: { $ref: "#/components/schemas/LoginResponse" }
        # 定义 400 身份契约节点的用途与约束。
        "400": { $ref: "#/components/responses/ProblemResponse" }
        # 定义 401 身份契约节点的用途与约束。
        "401": { $ref: "#/components/responses/ProblemResponse" }
  # 清除 Gateway Redis Session。
  /api/v1/auth/logout:
    # 定义 post 身份契约节点的用途与约束。
    post:
      # 定义 operationId 身份契约节点的用途与约束。
      operationId: logoutGatewaySession
      # 定义 tags 身份契约节点的用途与约束。
      tags: [GatewaySession]
      # 定义 security 身份契约节点的用途与约束。
      security: [{ SessionCookie: [], CsrfHeader: [] }]
      # 定义 responses 身份契约节点的用途与约束。
      responses:
        # 定义 204 身份契约节点的用途与约束。
        "204": { description: Built-in Identity 会话已清除 }
        # 定义 302 身份契约节点的用途与约束。
        "302": { description: OIDC BFF 会话已清除并进入受控 Provider 退出流程 }
        # 定义 403 身份契约节点的用途与约束。
        "403": { $ref: "#/components/responses/ProblemResponse" }
  # 公开下游校验短期内部 JWT 所需的 RSA 公钥。
  /api/v1/auth/jwks:
    # 定义 get 身份契约节点的用途与约束。
    get:
      # 定义 operationId 身份契约节点的用途与约束。
      operationId: getGatewayIdentityJwkSet
      # 定义 tags 身份契约节点的用途与约束。
      tags: [GatewayIdentity]
      # 定义 responses 身份契约节点的用途与约束。
      responses:
        # 定义 200 身份契约节点的用途与约束。
        "200":
          # 定义 description 身份契约节点的用途与约束。
          description: 不含私钥参数的 JWK Set
          # 定义 content 身份契约节点的用途与约束。
          content:
            # 定义 application/json 身份契约节点的用途与约束。
            application/json:
              # 定义 schema 身份契约节点的用途与约束。
              schema: { $ref: "#/components/schemas/JwkSet" }
  # 已登录用户验证当前密码后修改自己的本地密码。
  /api/v1/identity/me/password-changes:
    # 声明本人修改密码副作用操作。
    post:
      # 固定生成客户端使用的操作标识。
      operationId: changeOwnIdentityPassword
      # 归入 Gateway 本地身份分组。
      tags: [GatewayIdentity]
      # 同时要求本地 Session Cookie 和 CSRF Header。
      security: [{ SessionCookie: [], CsrfHeader: [] }]
      # 声明当前密码与新密码请求正文。
      requestBody:
        # 本人改密必须提供请求正文。
        required: true
        # 声明 JSON 请求媒体类型。
        content:
          # 固定只接受 JSON。
          application/json:
            # 复用本人改密封闭结构。
            schema: { $ref: "#/components/schemas/OwnPasswordChangeRequest" }
      # 声明本人改密响应。
      responses:
        # 成功时密码已提交且全部旧 Session 已失效。
        "204": { description: 密码修改成功且全部旧会话已注销 }
        # 新密码不符合策略或复用历史密码。
        "400": { $ref: "#/components/responses/ProblemResponse" }
        # 当前密码错误。
        "401": { $ref: "#/components/responses/ProblemResponse" }
        # 当前身份不是 Built-in Identity 本地会话。
        "403": { $ref: "#/components/responses/ProblemResponse" }
        # 本人改密尝试超过 Redis 固定窗口额度。
        "429": { $ref: "#/components/responses/ProblemResponse" }
  # 管理内置 Identity 账号。
  /api/v1/identity/accounts:
    # 定义 get 身份契约节点的用途与约束。
    get:
      # 定义 operationId 身份契约节点的用途与约束。
      operationId: listIdentityAccounts
      # 定义 tags 身份契约节点的用途与约束。
      tags: [GatewayIdentityManagement]
      # 定义 security 身份契约节点的用途与约束。
      security: [{ SessionCookie: [] }]
      # 定义 responses 身份契约节点的用途与约束。
      responses:
        # 定义 200 身份契约节点的用途与约束。
        "200":
          # 定义 description 身份契约节点的用途与约束。
          description: 最多一百个账号安全视图
          # 定义 content 身份契约节点的用途与约束。
          content:
            # 定义 application/json 身份契约节点的用途与约束。
            application/json:
              # 定义 schema 身份契约节点的用途与约束。
              schema:
                # 定义 type 身份契约节点的用途与约束。
                type: array
                # 定义 maxItems 身份契约节点的用途与约束。
                maxItems: 100
                # 定义 items 身份契约节点的用途与约束。
                items: { $ref: "#/components/schemas/IdentityAccount" }
        # 定义 403 身份契约节点的用途与约束。
        "403": { $ref: "#/components/responses/ProblemResponse" }
    # 定义 post 身份契约节点的用途与约束。
    post:
      # 定义 operationId 身份契约节点的用途与约束。
      operationId: createIdentityAccount
      # 定义 tags 身份契约节点的用途与约束。
      tags: [GatewayIdentityManagement]
      # 定义 security 身份契约节点的用途与约束。
      security: [{ SessionCookie: [], CsrfHeader: [] }]
      # 定义 parameters 身份契约节点的用途与约束。
      parameters:
        # 声明当前身份契约列表项及其约束。
        - { $ref: "#/components/parameters/IdempotencyKey" }
      # 定义 requestBody 身份契约节点的用途与约束。
      requestBody:
        # 定义 required 身份契约节点的用途与约束。
        required: true
        # 定义 content 身份契约节点的用途与约束。
        content:
          # 定义 application/json 身份契约节点的用途与约束。
          application/json:
            # 定义 schema 身份契约节点的用途与约束。
            schema: { $ref: "#/components/schemas/CreateAccountRequest" }
      # 定义 responses 身份契约节点的用途与约束。
      responses:
        # 定义 201 身份契约节点的用途与约束。
        "201":
          # 定义 description 身份契约节点的用途与约束。
          description: 账号已创建；仅首次成功执行返回临时密码
          # 定义 content 身份契约节点的用途与约束。
          content:
            # 定义 application/json 身份契约节点的用途与约束。
            application/json:
              # 定义 schema 身份契约节点的用途与约束。
              schema: { $ref: "#/components/schemas/CreatedAccount" }
        # 定义 400 身份契约节点的用途与约束。
        "400": { $ref: "#/components/responses/ProblemResponse" }
        # 定义 409 身份契约节点的用途与约束。
        "409": { $ref: "#/components/responses/ProblemResponse" }
  # 按乐观锁更新账号生命周期状态。
  /api/v1/identity/accounts/{accountId}/status:
    # 定义 patch 身份契约节点的用途与约束。
    patch:
      # 定义 operationId 身份契约节点的用途与约束。
      operationId: updateIdentityAccountStatus
      # 定义 tags 身份契约节点的用途与约束。
      tags: [GatewayIdentityManagement]
      # 定义 security 身份契约节点的用途与约束。
      security: [{ SessionCookie: [], CsrfHeader: [] }]
      # 定义 parameters 身份契约节点的用途与约束。
      parameters:
        # 声明当前身份契约列表项及其约束。
        - { $ref: "#/components/parameters/AccountId" }
      # 定义 requestBody 身份契约节点的用途与约束。
      requestBody:
        # 定义 required 身份契约节点的用途与约束。
        required: true
        # 定义 content 身份契约节点的用途与约束。
        content:
          # 定义 application/json 身份契约节点的用途与约束。
          application/json:
            # 定义 schema 身份契约节点的用途与约束。
            schema: { $ref: "#/components/schemas/UpdateStatusRequest" }
      # 定义 responses 身份契约节点的用途与约束。
      responses:
        # 定义 200 身份契约节点的用途与约束。
        "200":
          # 定义 description 身份契约节点的用途与约束。
          description: 更新后的账号安全视图
          # 定义 content 身份契约节点的用途与约束。
          content:
            # 定义 application/json 身份契约节点的用途与约束。
            application/json:
              # 定义 schema 身份契约节点的用途与约束。
              schema: { $ref: "#/components/schemas/IdentityAccount" }
        # 定义 400 身份契约节点的用途与约束。
        "400": { $ref: "#/components/responses/ProblemResponse" }
        # 定义 409 身份契约节点的用途与约束。
        "409": { $ref: "#/components/responses/ProblemResponse" }
  # 重置账号为必须首次改密的随机临时密码。
  /api/v1/identity/accounts/{accountId}/password-resets:
    # 定义 post 身份契约节点的用途与约束。
    post:
      # 定义 operationId 身份契约节点的用途与约束。
      operationId: resetIdentityAccountPassword
      # 定义 tags 身份契约节点的用途与约束。
      tags: [GatewayIdentityManagement]
      # 定义 security 身份契约节点的用途与约束。
      security: [{ SessionCookie: [], CsrfHeader: [] }]
      # 定义 parameters 身份契约节点的用途与约束。
      parameters:
        # 声明当前身份契约列表项及其约束。
        - { $ref: "#/components/parameters/AccountId" }
        # 声明当前身份契约列表项及其约束。
        - { $ref: "#/components/parameters/IdempotencyKey" }
      # 定义 responses 身份契约节点的用途与约束。
      responses:
        # 定义 200 身份契约节点的用途与约束。
        "200":
          # 定义 description 身份契约节点的用途与约束。
          description: 密码已重置；幂等重放不再次返回临时密码
          # 定义 content 身份契约节点的用途与约束。
          content:
            # 定义 application/json 身份契约节点的用途与约束。
            application/json:
              # 定义 schema 身份契约节点的用途与约束。
              schema: { $ref: "#/components/schemas/CreatedAccount" }
        # 定义 409 身份契约节点的用途与约束。
        "409": { $ref: "#/components/responses/ProblemResponse" }
  # 人工解除账号登录失败锁定。
  /api/v1/identity/accounts/{accountId}/unlock:
    # 定义 post 身份契约节点的用途与约束。
    post:
      # 定义 operationId 身份契约节点的用途与约束。
      operationId: unlockIdentityAccount
      # 定义 tags 身份契约节点的用途与约束。
      tags: [GatewayIdentityManagement]
      # 定义 security 身份契约节点的用途与约束。
      security: [{ SessionCookie: [], CsrfHeader: [] }]
      # 定义 parameters 身份契约节点的用途与约束。
      parameters:
        # 声明当前身份契约列表项及其约束。
        - { $ref: "#/components/parameters/AccountId" }
      # 定义 responses 身份契约节点的用途与约束。
      responses:
        # 定义 200 身份契约节点的用途与约束。
        "200":
          # 定义 description 身份契约节点的用途与约束。
          description: 解锁后的账号安全视图
          # 定义 content 身份契约节点的用途与约束。
          content:
            # 定义 application/json 身份契约节点的用途与约束。
            application/json:
              # 定义 schema 身份契约节点的用途与约束。
              schema: { $ref: "#/components/schemas/IdentityAccount" }
  # 查询最近身份安全事件。
  /api/v1/identity/security-events:
    # 定义 get 身份契约节点的用途与约束。
    get:
      # 定义 operationId 身份契约节点的用途与约束。
      operationId: listIdentitySecurityEvents
      # 定义 tags 身份契约节点的用途与约束。
      tags: [GatewayIdentityManagement]
      # 定义 security 身份契约节点的用途与约束。
      security: [{ SessionCookie: [] }]
      # 定义 responses 身份契约节点的用途与约束。
      responses:
        # 定义 200 身份契约节点的用途与约束。
        "200":
          # 定义 description 身份契约节点的用途与约束。
          description: 最近一百条脱敏身份安全事件
          # 定义 content 身份契约节点的用途与约束。
          content:
            # 定义 application/json 身份契约节点的用途与约束。
            application/json:
              # 定义 schema 身份契约节点的用途与约束。
              schema:
                # 定义 type 身份契约节点的用途与约束。
                type: array
                # 定义 maxItems 身份契约节点的用途与约束。
                maxItems: 100
                # 定义 items 身份契约节点的用途与约束。
                items: { $ref: "#/components/schemas/SecurityEvent" }
# 声明安全方案、参数、响应和 Schema。
components:
  # 定义 securitySchemes 身份契约节点的用途与约束。
  securitySchemes:
    # 定义 SessionCookie 身份契约节点的用途与约束。
    SessionCookie:
      # 定义 type 身份契约节点的用途与约束。
      type: apiKey
      # 定义 in 身份契约节点的用途与约束。
      in: cookie
      # 定义 name 身份契约节点的用途与约束。
      name: AGENTARK_SESSION
    # 定义 CsrfHeader 身份契约节点的用途与约束。
    CsrfHeader:
      # 定义 type 身份契约节点的用途与约束。
      type: apiKey
      # 定义 in 身份契约节点的用途与约束。
      in: header
      # 定义 name 身份契约节点的用途与约束。
