      required: [items, nextCursor, hasMore]
      # 定义分页字段。
      properties:
        # 当前页 Agent。
        items: { type: array, items: { $ref: "#/components/schemas/ReleaseAgent" } }
        # 下一页游标；末页为空。
        nextCursor: { type: [string, "null"] }
