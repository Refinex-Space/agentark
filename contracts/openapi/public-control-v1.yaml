    # 复用项目和 Revision 参数。
    parameters:
      # 项目标识。
      - { $ref: "#/components/parameters/ProjectId" }
      # Knowledge Revision 标识。
      - { $ref: "#/components/parameters/KnowledgeRevisionId" }
    # 幂等描述异步摄取意图，不冒充 Scheduler Job。
    post:
      # 稳定操作标识。
      operationId: requestKnowledgeIngestion
      # Knowledge 功能分组。
      tags: [Knowledge]
      # 幂等请求体。
      requestBody:
        # 请求不可省略。
        required: true
        # 请求媒体类型。
        content:
          # 固定 JSON 请求。
