name: Backend

on:
  pull_request:
    paths:
      - "**/pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - "agentark-*/**"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "**/pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - "agentark-*/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-test:
    name: Validate and test (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify reactor
        run: ./mvnw -B -ntp verify
