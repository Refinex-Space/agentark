    # 声明当前资源的幂等保存操作。
    put:
      # 固定生成客户端使用的稳定操作标识。
      operationId: saveGovernanceReleaseGate
      # 归入对应的 Governance 或 Evaluation 功能分组。
      tags: [Evaluation]
      # 声明当前写操作的 JSON 请求体。
      requestBody:
        # 声明当前参数或请求体是否必需。
        required: true
        # 声明当前请求或响应的媒体类型映射。
        content: { application/json: { schema: { $ref: "#/components/schemas/SaveReleaseGateRequest" } } }
      # 声明成功结果与稳定安全错误响应。
      responses:
        # 声明 HTTP 200 状态对应的响应。
        "200":
          # 说明当前请求、参数或响应的业务语义。
          description: Release Gate 已保存
          # 声明当前请求或响应的媒体类型映射。
          content: { application/json: { schema: { $ref: "#/components/schemas/ReleaseGate" } } }
        # 声明 HTTP 403 状态对应的响应。
        "403": { $ref: "#/components/responses/ProblemResponse" }
        # 声明 HTTP 409 状态对应的响应。
        "409": { $ref: "#/components/responses/ProblemResponse" }

